<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Enshrouded Embervale Map</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar"><div><span class="eyebrow">EMBERVALE SURVIVAL GUIDE</span><h1>Enshrouded Marker Map</h1></div><a href="https://pindrop.gg/enshrouded/map" target="_blank" rel="noreferrer">Source map ↗</a></header>
<main class="layout"><button class="mobile-toggle" id="toggle" aria-controls="sidebar" aria-expanded="false">☰ Filters and loot</button><aside class="sidebar" id="sidebar">
<label class="search"><span>Search markers</span><input id="search" placeholder="iron, gold chest, boss..."></label>
<div class="actions"><button id="fit">Fit map</button><button id="clear">Clear</button><button id="all">All</button></div>
<section><h2>Marker layers</h2><div id="layers" class="layers"></div></section>
<section class="legend"><h2>Selected marker</h2><div id="details">Click a marker on the map.</div></section>
<section><h2>Loot items</h2><div id="loot" class="loot"></div></section>
</aside><section class="map-shell"><div class="map-toolbar"><span id="status">Loading map...</span><span>Scroll to zoom · drag to pan · click a marker</span></div><div id="map"><canvas id="canvas"></canvas></div></section></main>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
